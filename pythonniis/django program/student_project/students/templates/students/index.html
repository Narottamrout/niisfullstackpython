<!DOCTYPE html>
<html>
<head>

<title>Student Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f7fb;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.avatar{
height:65px;
width:65px;
background:#1d3557;
color:white;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:bold;
margin:auto;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="row">

<div class="col-md-8">

<div class="d-flex justify-content-between">

<h2>Students</h2>

<span class="badge bg-success fs-6">

{{ students.count }} Total

</span>

</div>

<div class="row mt-4">

{% for student in students %}

<div class="col-md-6 mb-4">

<div class="card p-4 text-center">

<div class="avatar">

{{ student.name|slice:":2"|upper }}

</div>

<h4 class="mt-3">

{{ student.name }}

</h4>

<p class="text-muted">

Student #{{ student.roll_number }}

</p>

<a href="{% url 'edit_student' student.id %}" class="btn btn-warning btn-sm">

Edit

</a>

<a href="{% url 'delete_student' student.id %}" class="btn btn-danger btn-sm">

Delete

</a>

</div>

</div>

{% endfor %}

</div>

</div>

<div class="col-md-4">

<div class="card p-4">

<h3>Add Student</h3>

<form action="{% url 'add_student' %}" method="POST">

{% csrf_token %}

<div class="mb-3">

<input type="text"

name="name"

placeholder="Student Name"

class="form-control"

required>

</div>

<div class="mb-3">

<input type="number"

name="roll"

placeholder="Roll Number"

class="form-control"

required>

</div>

<button class="btn btn-success w-100">

Add Student

</button>

</form>

</div>

</div>

</div>

</div>

</body>

</html>
